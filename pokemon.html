<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="pokedex.css">
    <script src="pokedex.js" defer></script>
</head>

<body>

    <!-- Pokedex Binder -->
    <div id="pokedex-binder">

        <!-- Original Pokedex Content Box -->
        <div id="content-box">

            <!-- Left Side: Pokemon Information -->
            <div id="pokemon-info">

                <!-- Default Pokeball Image -->
                <img id="pokemon-img" src="./images/pb-transparent.png" alt="Pokeball"
                >

                <!-- Pokemon Types -->
                <div id="pokemon-types"></div>

                <!-- Pokemon Description -->
                <div id="pokemon-description"></div>

            </div>

            <!-- Right Side: Pokemon List -->
            <div id="pokemon-list"></div>

        </div>

        <!-- Generation Binder Tabs -->
        <div id="generation-tabs">
            <button class="gen-tab active" data-gen="1"> Gen 1 </button>
            <button class="gen-tab" data-gen="2"> Gen 2 </button>
            <button class="gen-tab" data-gen="3"> Gen 3 </button>
            <button class="gen-tab" data-gen="4"> Gen 4 </button>
            <button class="gen-tab" data-gen="5"> Gen 5 </button>
            <button class="gen-tab" data-gen="6"> Gen 6 </button>
            <button class="gen-tab" data-gen="7"> Gen 7 </button>
            <button class="gen-tab" data-gen="8"> Gen 8 </button>
            <button class="gen-tab" data-gen="9"> Gen 9 </button>
        </div>
    </div>
</body>
</html>
